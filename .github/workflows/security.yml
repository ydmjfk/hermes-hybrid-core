name: Hermes Hybrid Core Release Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-gate:
    name: Security & Release Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pip-audit

      - name: 1. Run Unit Tests (Hermes Core)
        run: |
          python -m unittest tests/test_hermes_core.py

      - name: 2. Run Governance Regression Tests
        run: |
          python -m unittest tests/test_security_governance.py

      - name: 3. Verify Capability Integrity & Approval Gates
        run: |
          python capabilities/verify_all_capabilities.py

      - name: 4. Run Security Test Matrix (SEC-001 ~ SEC-018)
        run: |
          python -m unittest discover -s tests/security -p "test_*.py"

      - name: 5. Public Privacy & Git History Release Audit
        run: |
          python check_security.py --scan-git-history

      - name: 6. Dependency Vulnerability Audit (Strict Fail-Closed)
        run: |
          pip-audit --desc on -r requirements.lock

      - name: Release Gate Status
        run: |
          echo "================================================================="
          echo "✅ ALL SECURITY RELEASE GATE CHECKS PASSED SUCCESSFULLY!"
          echo "Baseline: Security Baseline: Public Release Ready"
          echo "================================================================="
